trigger: none

resources:
  pipelines:
    - pipeline: savelyCI
      source: savely
      branch: refs/heads/develop
      trigger:
        branches:
          include:
            - develop

pool:
  vmImage: ubuntu-latest

steps:
  - download: savelyCI
    artifact: savely-api
    displayName: 'Download application artifact'

  - task: AzureWebApp@1
    displayName: 'Deploy to INT'
    inputs:
      azureSubscription: 'sc-savely-azure'
      appType: 'webAppLinux'
      appName: 'savely-api-int'
      package: '$(Pipeline.Workspace)/savelyCI/savely-api'