trigger:
  branches:
    include:
      - develop
  paths:
    include:
      - Kdtp-UI/**

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: 'production'

steps:
- task: NodeTool@0
  displayName: 'Install Node.js'
  inputs:
    versionSpec: '24.x'

- script: npm ci
  displayName: 'Install dependencies'
  workingDirectory: '$(Build.SourcesDirectory)/Kdtp-UI'

- script: npm run build
  displayName: 'Build React app'
  workingDirectory: '$(Build.SourcesDirectory)/Kdtp-UI'

- task: PublishPipelineArtifact@1
  displayName: 'Publish UI artifact'
  inputs:
    targetPath: '$(Build.SourcesDirectory)/Kdtp-UI/dist'
    artifact: 'kdtp-ui'
