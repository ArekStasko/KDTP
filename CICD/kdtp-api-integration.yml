trigger:
  branches:
    include:
      - develop

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: 'Release'

steps:

- task: UseDotNet@2
  displayName: 'Install .NET SDK'
  inputs:
    packageType: 'sdk'
    version: '10.x'

- script: dotnet restore Kdtp-Api/KDTP.sln
  displayName: 'Restore'

- script: dotnet build Kdtp-Api/KDTP.sln --configuration $(buildConfiguration) --no-restore
  displayName: 'Build'

- script: dotnet publish Kdtp-Api/Kdtp.Api/Kdtp.Api.csproj --configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/publish
  displayName: 'Publish'

- task: PublishPipelineArtifact@1
  displayName: 'Publish API artifact'
  inputs:
    targetPath: '$(Build.ArtifactStagingDirectory)/publish'
    artifact: 'kdtp-api'

- script: |
    mkdir -p "$(Build.ArtifactStagingDirectory)/migrations"
    dotnet tool run dotnet-ef migrations bundle \
      --project Kdtp-Api/Kdtp.Persistance/Kdtp.Persistance.csproj \
      --startup-project Kdtp-Api/Kdtp.Api/Kdtp.Api.csproj \
      --configuration $(buildConfiguration) \
      --output "$(Build.ArtifactStagingDirectory)/migrations/efbundle"
  displayName: "Build EF Core migration bundle"
  env:
    ASPNETCORE_ENVIRONMENT: Development

- task: PublishPipelineArtifact@1
  displayName: 'Publish migration artifact'
  inputs:
    targetPath: '$(Build.ArtifactStagingDirectory)/migrations'
    artifact: 'kdtp-migrations'